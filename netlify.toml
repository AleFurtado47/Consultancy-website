# Publish configuration, pinned in the repo on purpose.
#
# This site publishes the REPOSITORY ROOT. It always did, but the setting lived
# only in the Netlify UI, so the repo carried a `deploy/` folder that several
# handovers described as "what Netlify publishes". It was not. Nothing in
# `deploy/` was ever served as the site, and `deploy/_redirects` was never read.
#
# That went unnoticed for months because the two copies were kept identical and
# because Netlify resolves `.html` automatically: `/method` and `/card` worked
# with no rule behind them, exactly as `/index` still does. The first URL that
# genuinely needed a redirect rule was `/product-sheet`, and it 404'd in
# production on 13 August 2026.
#
# Pinning `publish` here makes the real answer live in the repo, where anyone
# reading the code can see it, and stops the UI setting drifting silently.

[build]
  publish = "."
  # No build step. The site is hand-written HTML served as-is.
  command = ""

# Redirects live in `_redirects` at the repo root, NOT here, and NOT in a
# subfolder. Netlify reads only the copy in the publish directory.
#
# Do not add a [[redirects]] block below: rules in netlify.toml take precedence
# over `_redirects`, and splitting them across two files is how the next silent
# 404 gets introduced.

# Headers are NOT set here, and the reason is worth keeping.
#
# Branch previews are served on a public subdomain
# (`<branch>--ale-furtado.netlify.app`) and Netlify adds no noindex header of
# its own. Verified 21 August 2026: the v2 subdomain had been serving a
# complete, crawlable copy of the site since July, a duplicate of every page on
# alefurtado.org competing with the real one.
#
# The obvious fix looks like a `[[context.branch-deploy.headers]]` block here.
# It does not work: header and redirect rules in netlify.toml are not
# context-aware, so such a block is accepted and then silently ignored. It was
# tried on this site and the deployed preview carried no header at all.
#
# What works is a `_headers` file at the repo root, which is why one exists on
# the preview branch only. **It must never reach main**, because it would
# noindex the live site. See `_headers` itself for the removal note.
